name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.24.x'
          go-package: ./...
      - name: Build
        run: go build ./cmd/api

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentflow
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentflow -d agentflow"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Run integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://agentflow:agentflow@localhost:5432/agentflow?sslmode=disable
          INTEGRATION_REDIS_ADDR: localhost:6379
        run: go test -race ./integration/...

  container:
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
