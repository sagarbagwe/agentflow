apiVersion: v1
kind: Secret
metadata:
  name: agentflow-secrets
  namespace: agentflow
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/agentflow?sslmode=require
  REDIS_ADDR: redis.example.internal:6379
  REDIS_PASSWORD: replace-me
  JWT_SECRET: replace-with-at-least-32-random-characters
  AGENTFLOW_API_KEY: replace-with-a-random-api-key
  AGENTFLOW_API_KEY_USER: 00000000-0000-0000-0000-000000000001
  LLM_API_KEY: replace-me
